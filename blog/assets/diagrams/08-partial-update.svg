<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 530 238" width="530" height="238" role="img"><defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9C8A8E"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D03C4A"/></marker></defs><rect width="530" height="238" rx="10" fill="#FAF2EC" stroke="#D8C7BC"/><text x="28" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#3A2A2E" font-weight="700" text-anchor="start">Response carries the view</text><rect x="28" y="52" width="210" height="40" rx="7" fill="#FFFFFF" stroke="#D8C7BC" stroke-width="1.5"/><text x="133.0" y="76.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="500" fill="#3A2A2E" text-anchor="middle">view + model</text><line x1="133" y1="96" x2="133" y2="124" stroke="#9C8A8E" stroke-width="1.6" marker-end="url(#am)"/><rect x="28" y="130" width="210" height="62" rx="7" fill="#FFFFFF" stroke="#D8C7BC" stroke-width="1.5"/><text x="133.0" y="158.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="500" fill="#3A2A2E" text-anchor="middle">every control rebuilt</text><text x="133.0" y="175.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9C8A8E" text-anchor="middle">focus, scroll and typing lost</text><line x1="266" y1="24" x2="266" y2="200" stroke="#D8C7BC"/><text x="292" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#3A2A2E" font-weight="700" text-anchor="start">Response carries the model alone</text><rect x="292" y="52" width="210" height="40" rx="7" fill="#F6E3E5" stroke="#D03C4A" stroke-width="1.5"/><text x="397.0" y="76.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="600" fill="#A83232" text-anchor="middle">model</text><line x1="397" y1="96" x2="397" y2="124" stroke="#D03C4A" stroke-width="1.6" marker-end="url(#ar)"/><rect x="292" y="130" width="210" height="62" rx="7" fill="#F6E3E5" stroke="#D03C4A" stroke-width="1.5"/><text x="397.0" y="158.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="600" fill="#A83232" text-anchor="middle">only bound controls update</text><text x="397.0" y="175.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9C8A8E" text-anchor="middle">the DOM around them stands</text><text x="28" y="218" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9C8A8E" font-weight="400" text-anchor="start">One IF in the app decides which of the two it is</text></svg>