<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 256" width="480" height="256" role="img"><defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9C8A8E"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D03C4A"/></marker></defs><rect width="480" height="256" rx="10" fill="#FAF2EC" stroke="#D8C7BC"/><text x="28" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#3A2A2E" font-weight="700" text-anchor="start">What each verb does to the cursor</text><rect x="28" y="58" width="62" height="28" rx="5" fill="#F6E3E5" stroke="#D03C4A" stroke-width="1.4"/><text x="59" y="77" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#A83232" font-weight="700" text-anchor="middle">ele</text><text x="104" y="77" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#3A2A2E" font-weight="400" text-anchor="start">adds a child and descends into it</text><text x="452" y="77" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9C8A8E" font-weight="400" text-anchor="end">down</text><rect x="28" y="96" width="62" height="28" rx="5" fill="#F6E3E5" stroke="#D03C4A" stroke-width="1.4"/><text x="59" y="115" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#A83232" font-weight="700" text-anchor="middle">tag</text><text x="104" y="115" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#3A2A2E" font-weight="400" text-anchor="start">adds a child and stays</text><text x="452" y="115" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9C8A8E" font-weight="400" text-anchor="end">stay</text><rect x="28" y="134" width="62" height="28" rx="5" fill="#F6E3E5" stroke="#D03C4A" stroke-width="1.4"/><text x="59" y="153" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#A83232" font-weight="700" text-anchor="middle">a</text><text x="104" y="153" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#3A2A2E" font-weight="400" text-anchor="start">sets an attribute on the current element</text><text x="452" y="153" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9C8A8E" font-weight="400" text-anchor="end">here</text><rect x="28" y="172" width="62" height="28" rx="5" fill="#F6E3E5" stroke="#D03C4A" stroke-width="1.4"/><text x="59" y="191" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#A83232" font-weight="700" text-anchor="middle">end</text><text x="104" y="191" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#3A2A2E" font-weight="400" text-anchor="start">ascends to the parent</text><text x="452" y="191" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9C8A8E" font-weight="400" text-anchor="end">up</text><line x1="28" y1="216" x2="452" y2="216" stroke="#D8C7BC"/><text x="28" y="236" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9C8A8E" font-weight="400" text-anchor="start">None of the four names a control, which is why every control is reachable</text></svg>