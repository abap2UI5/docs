# What a pull request against this documentation gets checked for.
#
# There was nothing before this: deploy.yml published without checking, so a
# broken build or a broken example reached the site and was found there. A docs
# repository has no compiler for its prose - but the fenced ABAP is code, and
# the site build is a build, so both can be decided before a merge.
#
# deploy.yml now runs this same list before it publishes, so this file is the
# pull-request half of one gate rather than a second opinion nothing acted on.
name: check

on:
  # Pull requests only. The same list runs on main from inside deploy.yml, in
  # the job that publishes - which is what makes a green deploy mean something.
  # Running it here as well would be the same work twice, and the version of it
  # that mattered was never the one connected to the deploy.
  pull_request:

  # ...and by hand, which there was no way to do. A pull request whose run
  # never got created left the thirteen gates with no way to be asked again
  # short of pushing something. This is that way - and it is how bump-linter
  # starts this workflow: a PR opened with the workflow's own GITHUB_TOKEN
  # raises no pull_request event at all, which is why those runs were missing.
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The sample catalogue, for the Working Samples blocks. Shallow, and
      # pinned to main on purpose: the links published here point at main, so
      # main is what they have to be true against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: abap2UI5/samples
          ref: main
          path: .samples
          fetch-depth: 1

      # The other two catalogues, for the figures generate-llms.mjs counts
      # into llms.txt during docs:build. Only SAMPLES.md is needed, so only
      # SAMPLES.md is fetched — and an unreachable repository costs one
      # counted figure, never the run: the generator leaves a number it
      # cannot count out of the line it writes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        with:
          repository: abap2UI5/samples-controls
          ref: main
          path: .samples-controls
          fetch-depth: 1
          sparse-checkout: |
            SAMPLES.md
            catalogue.json
            src
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        with:
          repository: abap2UI5/samples-stack
          ref: main
          path: .samples-stack
          fetch-depth: 1
          sparse-checkout: |
            SAMPLES.md
            catalogue.json
            src
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      # the catalogue parser, against a row of every shape the three sample
      # repositories generate. `npm run check` has run this since the parser
      # stopped matching for the second time; CI did not, so the one check that
      # exists BECAUSE something broke twice in silence was the only one no pull
      # request had to pass. Seconds, and no network.
      - name: unit tests
        run: npm test

      # the release number in the nav bar, the deprecations page and the
      # changelog, against the newest release tag of the framework. This one
      # goes stale WITHOUT anybody touching this repository - a release happens
      # over there - which is why it runs before the build: it is the check most
      # likely to be true yesterday and false today.
      - name: release version
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run check:version

      # THE SITE THAT IS PUBLISHED: VitePress's build, from this repository
      # alone. A page that does not build is a page nobody can read.
      - name: build the site
        if: ${{ !cancelled() }}
        run: npm run docs:build

      # every link out of this deployment and into a neighbouring one on the
      # same origin - the playground, the catalogue, the linter's rule pages.
      # They share an origin, so VitePress's router takes such a link over,
      # finds no page of THIS site behind it and renders the 404 at the
      # neighbour's URL. It read as the other site being broken. Reads the
      # built HTML, so it runs after the build
      - name: cross-site links
        if: ${{ !cancelled() }}
        run: npm run check:cross-site

      # every image under docs/public: a screenshot is WebP, a deliverable is
      # one of the PNGs the logo page hands out, none is over its budget, and
      # the build can measure each - a page reserves an image's box before it
      # arrives, and one nothing can measure moves the page when it does
      - name: images
        if: ${{ !cancelled() }}
        run: npm run check:images

      # the ABAP in the fenced blocks, against the real framework: does it
      # compile, and does the view it builds name controls and properties that
      # exist on the UI5 floor this documentation targets
      - name: ABAP examples
        if: ${{ !cancelled() }}
        run: npm run check:examples

      # the two house conventions the sample corpora gate and this repository
      # did not: the view-chain layout (the linter's chain-house-layout rule,
      # opt-in, so check:examples never emitted it) and the three class section
      # blocks. Style is not decidable in prose, but in a fenced class it is -
      # and this is the site where the style is learned
      - name: house conventions
        if: ${{ !cancelled() }}
        run: npm run check:conventions

      # a page that is WRAPPED has to stay wrapped. The manual is not written to
      # one column - 39 pages are wrapped, 59 are one line per paragraph - so a
      # site-wide column would be a reformat, not a gate. What is decidable is
      # the drift: an editor rewrites a paragraph, hands it back as one long
      # line, and the next diff of that paragraph is one changed line instead of
      # three, so every later correction to it reads as a rewrite. It arrived
      # twice in two days on the same page. npm run fix:line-length rewraps.
      - name: line length
        if: ${{ !cancelled() }}
        run: npm run check:line-length

      # every prose word against a dictionary, and then against the words this
      # project uses that a dictionary does not carry. test/spelling.test.mjs
      # answers WHICH spelling of a word (it names British forms from a list);
      # it cannot see a word that is neither spelling of anything. "thant",
      # "havte", "fullfll" and "requoirememnts" went through the browser
      # editor, through this workflow and out to the published site in two
      # days, one of them in the first sentence of a page - which is where the
      # search index, llms.txt and the card subtitle take their description.
      - name: vocabulary
        if: ${{ !cancelled() }}
        run: npm run check:vocabulary

      # every prose word against the phrases of the site for decision makers
      # - license fee, per-user, ROI, business case. The manual is for
      # developers and links that site; a page that argues the case itself is
      # a second, unmaintained copy of it. Four pages may use the words: the
      # license, support and sponsoring pages, and the one sentence in
      # "In a Nutshell" that hands the reader over
      - name: audience
        if: ${{ !cancelled() }}
        run: npm run check:audience

      # every complete app class either carries a Run button or a marker on its
      # page saying why it cannot run in the playground. The rules that offer
      # the button fail towards NOT offering one, so without this an example
      # nobody measured is indistinguishable from an example that can never
      # run - and the hand-kept ledger of that difference had already gone stale
      - name: Run-button coverage
        if: ${{ !cancelled() }}
        run: npm run check:playground

      # every `client->` name on the site - in the prose and in the snippets
      # check:examples cannot compile because they are not whole classes -
      # against z2ui5_if_client on main, the framework branch this site
      # tracks (scripts/lib/release.mjs, frameworkRef). Four pages
      # taught API that 1.143.0 had deleted, and nothing here was red.
      - name: API names
        if: ${{ !cancelled() }}
        run: npm run check:api-names

      # the committed API reference (resources/api.md and the JSON next to it),
      # regenerated from z2ui5_if_client on main, the branch the site tracks, and
      # compared against what is committed. The reference is generated so it
      # cannot drift from the interface by hand - this is what makes that true
      # after the interface changes over there too
      - name: API reference freshness
        if: ${{ !cancelled() }}
        run: npm run check:api-reference

      # the committed custom-controls reference (resources/controls.md),
      # regenerated from app/webapp/cc on main - the metadata of every
      # control the frontend ships, read by running each module - and
      # compared byte for byte, the same way the API reference is. Lists the
      # directory through the repository's contents API, so it needs
      # github.com like the step above does
      - name: controls reference freshness
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run check:controls

      # the Working Samples blocks: still generated from what the catalogue says
      # today, still pointing at classes that exist, and still pointed back at
      # from those classes. A link into another repository is the one kind that
      # goes stale without anybody here touching a file
      - name: sample links
        if: ${{ !cancelled() }}
        run: npm run check:samples
