# What a pull request against this documentation gets checked for.
#
# There was nothing before this: deploy.yml published without checking, so a
# broken build or a broken example reached the site and was found there. A docs
# repository has no compiler for its prose - but the fenced ABAP is code, and
# the site build is a build, so both can be decided before a merge.
#
# deploy.yml now runs this same list before it publishes, so this file is the
# pull-request half of one gate rather than a second opinion nothing acted on.
name: check

on:
  # Pull requests only. The same list runs on main from inside deploy.yml, in
  # the job that publishes - which is what makes a green deploy mean something.
  # Running it here as well would be the same work twice, and the version of it
  # that mattered was never the one connected to the deploy.
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The sample catalogue, for the Working Samples blocks. Shallow, and
      # pinned to main on purpose: the links published here point at main, so
      # main is what they have to be true against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: abap2UI5/samples
          ref: main
          path: .samples
          fetch-depth: 1

      # The other two catalogues, for the figures generate-llms.mjs counts
      # into llms.txt during docs:build. Only SAMPLES.md is needed, so only
      # SAMPLES.md is fetched — and an unreachable repository costs one
      # counted figure, never the run: the generator leaves a number it
      # cannot count out of the line it writes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        with:
          repository: abap2UI5/samples-controls
          ref: main
          path: .samples-controls
          fetch-depth: 1
          sparse-checkout: SAMPLES.md
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        with:
          repository: abap2UI5/samples-stack
          ref: main
          path: .samples-stack
          fetch-depth: 1
          sparse-checkout: SAMPLES.md
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      # the catalogue parser, against a row of every shape the three sample
      # repositories generate. `npm run check` has run this since the parser
      # stopped matching for the second time; CI did not, so the one check that
      # exists BECAUSE something broke twice in silence was the only one no pull
      # request had to pass. Seconds, and no network.
      - name: unit tests
        run: npm test

      # the release number in the nav bar, the deprecations page and the
      # changelog, against the newest release tag of the framework. This one
      # goes stale WITHOUT anybody touching this repository - a release happens
      # over there - which is why it runs before the build: it is the check most
      # likely to be true yesterday and false today.
      - name: release version
        if: ${{ !cancelled() }}
        run: npm run check:version

      # a page that does not build is a page nobody can read
      - name: vitepress build
        if: ${{ !cancelled() }}
        run: npm run docs:build

      # the ABAP in the fenced blocks, against the real framework: does it
      # compile, and does the view it builds name controls and properties that
      # exist on the UI5 floor this documentation targets
      - name: ABAP examples
        if: ${{ !cancelled() }}
        run: npm run check:examples

      # the two house conventions the sample corpora gate and this repository
      # did not: the view-chain layout (the linter's chain-house-layout rule,
      # opt-in, so check:examples never emitted it) and the three class section
      # blocks. Style is not decidable in prose, but in a fenced class it is -
      # and this is the site where the style is learned
      - name: house conventions
        if: ${{ !cancelled() }}
        run: npm run check:conventions

      # every complete app class either carries a Run button or a marker on its
      # page saying why it cannot run in the playground. The rules that offer
      # the button fail towards NOT offering one, so without this an example
      # nobody measured is indistinguishable from an example that can never
      # run - and the hand-kept ledger of that difference had already gone stale
      - name: Run-button coverage
        if: ${{ !cancelled() }}
        run: npm run check:playground

      # every `client->` name on the site - in the prose and in the snippets
      # check:examples cannot compile because they are not whole classes -
      # against z2ui5_if_client at the release this site names. Four pages
      # taught API that 1.143.0 had deleted, and nothing here was red.
      - name: API names
        if: ${{ !cancelled() }}
        run: npm run check:api-names

      # the committed API reference (resources/api.md and the JSON next to it),
      # regenerated from z2ui5_if_client at the release the site names and
      # compared against what is committed. The reference is generated so it
      # cannot drift from the interface by hand - this is what makes that true
      # after a release too
      - name: API reference freshness
        if: ${{ !cancelled() }}
        run: npm run check:api-reference

      # the Working Samples blocks: still generated from what the catalogue says
      # today, still pointing at classes that exist, and still pointed back at
      # from those classes. A link into another repository is the one kind that
      # goes stale without anybody here touching a file
      - name: sample links
        if: ${{ !cancelled() }}
        run: npm run check:samples
