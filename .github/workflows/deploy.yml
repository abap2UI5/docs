# Build and deploy the VitePress site to GitHub Pages.
#
# This used to build and publish without running a single check. check.yml ran
# the gates (six of them then) in parallel on the same push, which looks
# equivalent and is not: nothing connected the two, so a red check and a green deploy simply both
# happened, and the site went out with whatever the gates had objected to. The
# gates are the ones that go stale WITHOUT anybody touching this repository -
# a release is published elsewhere, a sample class is renamed elsewhere - so
# "it was green when it merged" is not the same claim as "it is true now".
#
# So the gates run here, in the job that publishes, and the build only follows
# a green one. check.yml keeps them for pull requests; it no longer runs on
# main, because this is that run.
name: Deploy the site to Pages

on:
  # Runs on pushes targeting the `main` branch. Change this to `master` if you're
  # using the `master` branch as the default branch.
  push:
    branches: [main]

  # And every night: the release number and the sample links name things in
  # other repositories that move without this one being touched. This site
  # borrows nothing from another site at build time; it is built from this
  # repository alone.
  schedule:
    - cron: '0 5 * * *'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# The token reads, and nothing more, unless a job says otherwise. Writing to
# Pages and minting the OIDC token are the DEPLOY job's alone (below): the
# build job runs `npm ci` and every gate's dependencies, and none of that code
# needs to be able to publish a site.
permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # pages: read is configure-pages', which reads the site's settings
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Not needed if lastUpdated is not enabled

      # abap2UI5/samples, in full: check:samples holds every Working Samples
      # block and every hand-written source link to it. NOT continue-on-error,
      # unlike the two below and unlike its first version: without this
      # checkout check:samples SKIPS rather than fails, so an unreachable
      # repository published a site whose sample links nothing had checked -
      # check.yml never allowed that for a pull request.
      - name: Sample catalogues
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: abap2UI5/samples
          ref: main
          path: .samples
          fetch-depth: 1

      # The other two catalogues, for the corpus sizes in the generated
      # llms.txt and the classes a page declares from them. `continue-on-error`
      # is the point here: generate-llms.mjs leaves the number out when a
      # catalogue is not here, and link-samples.mjs falls back to the
      # catalogue.json each one publishes, so an unreachable repository costs
      # the deploy a figure, never the site.
      - name: Sample catalogues (controls)
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: abap2UI5/samples-controls
          ref: main
          path: .samples-controls
          fetch-depth: 1
          sparse-checkout: |
            SAMPLES.md
            catalogue.json
            src
          sparse-checkout-cone-mode: false
      # samples-stack was missing here while generate-llms.mjs counts three
      # catalogues into the llms.txt it publishes. The deploy therefore
      # published a list it had counted two thirds of.
      - name: Sample catalogues (stack)
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: abap2UI5/samples-stack
          ref: main
          path: .samples-stack
          fetch-depth: 1
          sparse-checkout: |
            SAMPLES.md
            catalogue.json
            src
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm # or pnpm / yarn
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Install dependencies
        run: npm ci

      # The same thirteen gates check.yml runs for a pull request, and the reason
      # each one is here is written above it there. The ORDER is the one thing
      # that cannot match: this job has to build the site it publishes, so the
      # build and `check:cross-site` - which judges the built HTML - come
      # after the twelve that need none of them, instead of third to fifth.
      # What has to stay in step is the SET; a gate that runs for a pull
      # request and not for the deploy is a gate main can be published past.
      # `!cancelled()` so one failure still reports the others: a deploy that
      # is going to be refused should say everything that is wrong with it in
      # one run.
      - name: unit tests
        run: npm test
      - name: release version
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run check:version
      - name: images
        if: ${{ !cancelled() }}
        run: npm run check:images
      - name: ABAP examples
        if: ${{ !cancelled() }}
        run: npm run check:examples
      - name: house conventions
        if: ${{ !cancelled() }}
        run: npm run check:conventions
      - name: line length
        if: ${{ !cancelled() }}
        run: npm run check:line-length
      - name: vocabulary
        if: ${{ !cancelled() }}
        run: npm run check:vocabulary
      - name: audience
        if: ${{ !cancelled() }}
        run: npm run check:audience
      - name: Run-button coverage
        if: ${{ !cancelled() }}
        run: npm run check:playground
      - name: API names
        if: ${{ !cancelled() }}
        run: npm run check:api-names
      - name: API reference freshness
        if: ${{ !cancelled() }}
        run: npm run check:api-reference
      - name: controls reference freshness
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run check:controls
      - name: sample links
        if: ${{ !cancelled() }}
        run: npm run check:samples

      # …and only then the thing that gets published. `docs:build` is itself
      # one of the gates - a page that does not build is a page nobody can
      # read - so it stays a build step rather than being listed twice.
      # THE SITE THAT IS PUBLISHED: VitePress's build, from this repository
      # alone.
      - name: Build the site
        # the search index lists the organisations' repositories and the
        # framework's classes from the GitHub API (scripts/lib/search-family.mjs)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run docs:build

      # The one gate that cannot run before the build, because what it judges
      # is the built HTML: every link into a neighbouring deployment on this
      # origin carries the attribute that keeps VitePress's router off it.
      # Between the build and the upload, so a site whose bar leads to its own
      # 404 is not what gets published.
      - name: cross-site links
        run: npm run check:cross-site

      # WHAT GOES OUT IS VitePress's OUTPUT. Its root is served at /docs/, the
      # `base` in config.mjs.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Deploy
    # the only job that publishes, so the only one that may
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1