<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 218" width="700" height="218" role="img"><style data-dark="">@media (prefers-color-scheme:dark){[fill="#FAF2EC"]{fill:#172033}[fill="#F0DFD2"]{fill:#1e2940}[fill="#FFFFFF"]{fill:#0f1522}[fill="#3A2A2E"]{fill:#f1f4f9}[fill="#6F5D63"]{fill:#9aa4b5}[fill="#F6E3E5"]{fill:#3a1d22}[fill="#D03C4A"]{fill:#f0606d}[fill="#A83232"]{fill:#ff8a95}[stroke="#D8C7BC"]{stroke:#34405a}[stroke="#9C8A8E"]{stroke:#6b778c}[stroke="#D03C4A"]{stroke:#f0606d}}</style><defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6F5D63"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D03C4A"/></marker></defs><rect width="700" height="218" rx="10" fill="#FAF2EC" stroke="#D8C7BC"/><text x="28" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#3A2A2E" font-weight="700" text-anchor="start">One attribute, there and back</text><rect x="28" y="58" width="170" height="48" rx="7" fill="#F6E3E5" stroke="#D03C4A" stroke-width="1.5"/><text x="113" y="79.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#A83232" font-weight="600" text-anchor="middle">quantity</text><text x="113" y="96.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#6F5D63" font-weight="400" text-anchor="middle">a public attribute, 500</text><rect x="265" y="58" width="170" height="48" rx="7" fill="#FFFFFF" stroke="#D8C7BC" stroke-width="1.5"/><text x="350" y="79.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#3A2A2E" font-weight="500" text-anchor="middle">{/QUANTITY}</text><text x="350" y="96.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#6F5D63" font-weight="400" text-anchor="middle">in the view, and in the model</text><rect x="502" y="58" width="170" height="48" rx="7" fill="#FFFFFF" stroke="#D8C7BC" stroke-width="1.5"/><text x="587" y="79.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#3A2A2E" font-weight="500" text-anchor="middle">Input</text><text x="587" y="96.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#6F5D63" font-weight="400" text-anchor="middle">shows 500</text><line x1="204" y1="82" x2="259" y2="82" stroke="#D03C4A" stroke-width="1.6" marker-end="url(#ar)"/><text x="231" y="73" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#D03C4A" font-weight="600" text-anchor="middle">_bind( )</text><line x1="441" y1="82" x2="496" y2="82" stroke="#9C8A8E" stroke-width="1.6" marker-end="url(#am)"/><text x="468" y="73" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#6F5D63" font-weight="400" text-anchor="middle">renders</text><path d="M587 112 L587 142 L113 142 L113 114" fill="none" stroke="#D03C4A" stroke-width="1.6" marker-end="url(#ar)"/><text x="350" y="162" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#D03C4A" font-weight="600" text-anchor="middle">the user types 600 - it travels with the next event and is in the attribute before main( ) runs</text><line x1="28" y1="180" x2="672" y2="180" stroke="#D8C7BC"/><text x="28" y="200" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#6F5D63" font-weight="400" text-anchor="start">No getter, no setter, no mapping - the control is bound to the attribute by its name</text></svg>
