<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" role="img"><style data-dark="">@media (prefers-color-scheme:dark){[fill="#FAF2EC"]{fill:#172033}[fill="#F0DFD2"]{fill:#1e2940}[fill="#FFFFFF"]{fill:#0f1522}[fill="#3A2A2E"]{fill:#f1f4f9}[fill="#6F5D63"]{fill:#9aa4b5}[fill="#F6E3E5"]{fill:#3a1d22}[fill="#D03C4A"]{fill:#f0606d}[fill="#A83232"]{fill:#ff8a95}[stroke="#D8C7BC"]{stroke:#34405a}[stroke="#9C8A8E"]{stroke:#6b778c}[stroke="#D03C4A"]{stroke:#f0606d}}</style><defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6F5D63"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D03C4A"/></marker></defs><rect width="700" height="330" rx="10" fill="#FAF2EC" stroke="#D8C7BC"/><text x="28" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#3A2A2E" font-weight="700" text-anchor="start">How a table reaches the screen, and how a change comes back</text><rect x="28" y="52" width="290" height="196" rx="7" fill="none" stroke="#D8C7BC" stroke-width="1.5"/><text x="40" y="70" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#6F5D63" font-weight="400" text-anchor="start">ABAP server - your app class</text><rect x="44" y="82" width="258" height="46" rx="7" fill="#FFFFFF" stroke="#D8C7BC" stroke-width="1.5"/><text x="173.0" y="102.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#3A2A2E" font-weight="500" text-anchor="middle">mt_itab</text><text x="173.0" y="118.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#6F5D63" font-weight="400" text-anchor="middle">a public attribute, an internal table</text><rect x="44" y="146" width="258" height="46" rx="7" fill="#FFFFFF" stroke="#D8C7BC" stroke-width="1.5"/><text x="173.0" y="166.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#3A2A2E" font-weight="500" text-anchor="middle">client-&gt;_bind( mt_itab )</text><text x="173.0" y="182.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#6F5D63" font-weight="400" text-anchor="middle">returns the path of the table</text><text x="173" y="226" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#6F5D63" font-weight="400" text-anchor="middle">rows: COUNT, VALUE, DESCR</text><rect x="382" y="52" width="290" height="196" rx="7" fill="none" stroke="#D8C7BC" stroke-width="1.5"/><text x="394" y="70" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#6F5D63" font-weight="400" text-anchor="start">browser - the Table control</text><rect x="398" y="82" width="258" height="46" rx="7" fill="#FFFFFF" stroke="#D8C7BC" stroke-width="1.5"/><text x="527.0" y="102.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#3A2A2E" font-weight="500" text-anchor="middle">items</text><text x="527.0" y="118.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#6F5D63" font-weight="400" text-anchor="middle">the aggregation: the list of rows</text><rect x="398" y="146" width="258" height="46" rx="7" fill="#F6E3E5" stroke="#D03C4A" stroke-width="1.5"/><text x="527.0" y="166.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#A83232" font-weight="600" text-anchor="middle">ColumnListItem</text><text x="527.0" y="182.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#6F5D63" font-weight="400" text-anchor="middle">the template: one row, repeated</text><text x="527" y="214" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#A83232" font-weight="400" text-anchor="middle">{COUNT}  {VALUE}  {DESCR}</text><text x="527" y="232" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#6F5D63" font-weight="400" text-anchor="middle">paths relative to the row</text><line x1="306" y1="105" x2="394" y2="105" stroke="#9C8A8E" stroke-width="1.6" marker-end="url(#am)"/><text x="350" y="97" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#6F5D63" font-weight="400" text-anchor="middle">model</text><line x1="527" y1="130" x2="527" y2="144" stroke="#9C8A8E" stroke-width="1.6" marker-end="url(#am)"/><line x1="394" y1="180" x2="306" y2="180" stroke="#D03C4A" stroke-width="1.6" marker-end="url(#ar)"/><text x="350" y="172" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#A83232" font-weight="400" text-anchor="middle">changes</text><text x="350" y="268" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#6F5D63" font-weight="400" text-anchor="middle">a typed cell or a ticked row comes back with the next event, into the same rows of mt_itab</text><line x1="28" y1="292" x2="672" y2="292" stroke="#D8C7BC"/><text x="28" y="312" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#6F5D63" font-weight="400" text-anchor="start">One bound table, one row template. UI5 repeats the template for every row of the table.</text></svg>
