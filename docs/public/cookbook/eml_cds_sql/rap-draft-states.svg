<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" role="img"><style data-dark="">@media (prefers-color-scheme:dark){[fill="#FAF2EC"]{fill:#172033}[fill="#F0DFD2"]{fill:#1e2940}[fill="#FFFFFF"]{fill:#0f1522}[fill="#3A2A2E"]{fill:#f1f4f9}[fill="#6F5D63"]{fill:#9aa4b5}[fill="#F6E3E5"]{fill:#3a1d22}[fill="#D03C4A"]{fill:#f0606d}[fill="#A83232"]{fill:#ff8a95}[stroke="#D8C7BC"]{stroke:#34405a}[stroke="#9C8A8E"]{stroke:#6b778c}[stroke="#D03C4A"]{stroke:#f0606d}}</style><defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6F5D63"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D03C4A"/></marker></defs><rect width="700" height="300" rx="10" fill="#FAF2EC" stroke="#D8C7BC"/><text x="28" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#3A2A2E" font-weight="700" text-anchor="start">RAP draft: the life of one edit</text><rect x="28" y="110" width="150" height="52" rx="7" fill="#FFFFFF" stroke="#D8C7BC" stroke-width="1.5"/><text x="103.0" y="133.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3A2A2E" font-weight="500" text-anchor="middle">active record</text><text x="103.0" y="149.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#6F5D63" font-weight="400" text-anchor="middle">what everyone reads</text><rect x="275" y="110" width="150" height="52" rx="7" fill="#F6E3E5" stroke="#D03C4A" stroke-width="1.5"/><text x="350.0" y="133.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#A83232" font-weight="600" text-anchor="middle">RAP draft</text><text x="350.0" y="149.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#6F5D63" font-weight="400" text-anchor="middle">the user is editing</text><rect x="522" y="62" width="150" height="52" rx="7" fill="#FFFFFF" stroke="#D8C7BC" stroke-width="1.5"/><text x="597.0" y="85.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3A2A2E" font-weight="500" text-anchor="middle">active record</text><text x="597.0" y="101.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#6F5D63" font-weight="400" text-anchor="middle">updated</text><rect x="522" y="158" width="150" height="52" rx="7" fill="#FFFFFF" stroke="#D8C7BC" stroke-width="1.5"/><text x="597.0" y="181.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3A2A2E" font-weight="500" text-anchor="middle">active record</text><text x="597.0" y="197.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#6F5D63" font-weight="400" text-anchor="middle">unchanged</text><line x1="180" y1="136" x2="273" y2="136" stroke="#9C8A8E" stroke-width="1.6" marker-end="url(#am)"/><text x="226" y="128" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#3A2A2E" font-weight="600" text-anchor="middle">Edit</text><text x="226" y="154" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#6F5D63" font-weight="400" text-anchor="middle">takes the lock</text><path d="M427 124 L520 92" fill="none" stroke="#9C8A8E" stroke-width="1.6" marker-end="url(#am)"/><text x="462" y="94" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#3A2A2E" font-weight="600" text-anchor="middle">Activate</text><path d="M427 148 L520 180" fill="none" stroke="#9C8A8E" stroke-width="1.6" marker-end="url(#am)"/><text x="478" y="150" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#3A2A2E" font-weight="600" text-anchor="middle">Discard</text><path d="M320 108 C320 70 380 70 380 106" fill="none" stroke="#9C8A8E" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#am)"/><text x="350" y="66" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#6F5D63" font-weight="400" text-anchor="middle">Resume: the user comes back later</text><text x="300" y="200" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#6F5D63" font-weight="400" text-anchor="middle">every change is saved into the draft</text><text x="28" y="238" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#6F5D63" font-weight="400" text-anchor="start">This is the draft of a RAP business object. The app draft of abap2UI5 is something else.</text><line x1="28" y1="262" x2="672" y2="262" stroke="#D8C7BC"/><text x="28" y="282" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#6F5D63" font-weight="400" text-anchor="start">Dashed: the draft waits on the server between two visits. Activate or Discard ends it.</text></svg>
