<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 706 210" width="706" height="210" role="img"><style data-dark="">@media (prefers-color-scheme:dark){[fill="#FAF2EC"]{fill:#172033}[fill="#F0DFD2"]{fill:#1e2940}[fill="#FFFFFF"]{fill:#0f1522}[fill="#3A2A2E"]{fill:#f1f4f9}[fill="#9C8A8E"]{fill:#9aa4b5}[fill="#F6E3E5"]{fill:#3a1d22}[fill="#D03C4A"]{fill:#f0606d}[fill="#A83232"]{fill:#ff8a95}[stroke="#D8C7BC"]{stroke:#34405a}[stroke="#9C8A8E"]{stroke:#6b778c}[stroke="#D03C4A"]{stroke:#f0606d}}</style><defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9C8A8E"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D03C4A"/></marker></defs><rect width="706" height="210" rx="10" fill="#FAF2EC" stroke="#D8C7BC"/><text x="28" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#3A2A2E" font-weight="700" text-anchor="start">A popup as a class of its own - and how its answer comes back</text><rect x="28" y="56" width="190" height="96" rx="7" fill="#FFFFFF" stroke="#D8C7BC" stroke-width="1.5"/><text x="123" y="79" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#3A2A2E" font-weight="500" text-anchor="middle">the caller</text><text x="123" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#9C8A8E" font-weight="400" text-anchor="middle">on the event DELETE:</text><text x="123" y="116" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#9C8A8E" font-weight="400" text-anchor="middle">sets the question,</text><text x="123" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#9C8A8E" font-weight="400" text-anchor="middle">nav_app_call( popup )</text><line x1="224" y1="104" x2="252" y2="104" stroke="#D03C4A" stroke-width="1.6" marker-end="url(#ar)"/><rect x="258" y="56" width="190" height="96" rx="7" fill="#F6E3E5" stroke="#D03C4A" stroke-width="1.5"/><text x="353" y="79" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#A83232" font-weight="600" text-anchor="middle">the popup class</text><text x="353" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#9C8A8E" font-weight="400" text-anchor="middle">popup_display( )</text><text x="353" y="116" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#9C8A8E" font-weight="400" text-anchor="middle">the user presses OK,</text><text x="353" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#9C8A8E" font-weight="400" text-anchor="middle">nav_app_leave( )</text><line x1="454" y1="104" x2="482" y2="104" stroke="#D03C4A" stroke-width="1.6" marker-end="url(#ar)"/><rect x="488" y="56" width="190" height="96" rx="7" fill="#FFFFFF" stroke="#D8C7BC" stroke-width="1.5"/><text x="583" y="79" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#3A2A2E" font-weight="500" text-anchor="middle">the caller, again</text><text x="583" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#9C8A8E" font-weight="400" text-anchor="middle">check_on_navigated( ):</text><text x="583" y="116" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#9C8A8E" font-weight="400" text-anchor="middle">get_app_prev( ),</text><text x="583" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#9C8A8E" font-weight="400" text-anchor="middle">reads the answer</text><line x1="28" y1="172" x2="678" y2="172" stroke="#D8C7BC"/><text x="28" y="192" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9C8A8E" font-weight="400" text-anchor="start">The answer is not a parameter: it is an attribute of the popup instance the caller gets back</text></svg>
