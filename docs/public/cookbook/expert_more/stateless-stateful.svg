a Neue',Arial,sans-serif" font-size="12.5" fill="#3A2A2E" font-weight="500" text-anchor="middle">roundtrip</text><rect x="482" y="142" width="130" height="32" rx="7" fill="#FFFFFF" stroke="#D8C7BC" stroke-width="1.5"/><text x="547" y="162.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#3A2A2E" font-weight="500" text-anchor="middle">roundtrip</text><text x="150" y="198" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#9C8A8E" font-weight="400" text-anchor="start">between them: one session stays with this user - its locks, its globals, its LUW</text><line x1="28" y1="216" x2="620" y2="216" stroke="#D8C7BC"/><text x="28" y="236" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9C8A8E" font-weight="400" text-anchor="start">set_session_stateful( ) moves a running app to the second row; the first row is what scales</text></svg>
