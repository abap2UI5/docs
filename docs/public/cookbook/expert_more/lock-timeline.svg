<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" role="img"><style data-dark="">@media (prefers-color-scheme:dark){[fill="#FAF2EC"]{fill:#172033}[fill="#F0DFD2"]{fill:#1e2940}[fill="#FFFFFF"]{fill:#0f1522}[fill="#3A2A2E"]{fill:#f1f4f9}[fill="#6F5D63"]{fill:#9aa4b5}[fill="#F6E3E5"]{fill:#3a1d22}[fill="#D03C4A"]{fill:#f0606d}[fill="#A83232"]{fill:#ff8a95}[stroke="#D8C7BC"]{stroke:#34405a}[stroke="#9C8A8E"]{stroke:#6b778c}[stroke="#D03C4A"]{stroke:#f0606d}}</style><defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6F5D63"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D03C4A"/></marker></defs><rect width="700" height="330" rx="10" fill="#FAF2EC" stroke="#D8C7BC"/><text x="28" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#3A2A2E" font-weight="700" text-anchor="start">Two users, one record: where the second save is stopped</text><text x="28" y="84" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#3A2A2E" font-weight="600" text-anchor="start">user A</text><text x="28" y="144" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#3A2A2E" font-weight="600" text-anchor="start">user B</text><rect x="86" y="66" width="120" height="34" rx="7" fill="#FFFFFF" stroke="#D8C7BC" stroke-width="1.5"/><text x="146.0" y="80.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#3A2A2E" font-weight="500" text-anchor="middle">open</text><text x="146.0" y="96.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#6F5D63" font-weight="400" text-anchor="middle">reads timestamp T1</text><rect x="326" y="66" width="108" height="34" rx="7" fill="#FFFFFF" stroke="#D8C7BC" stroke-width="1.5"/><text x="380.0" y="80.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#3A2A2E" font-weight="500" text-anchor="middle">save</text><text x="380.0" y="96.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#6F5D63" font-weight="400" text-anchor="middle">writes, now T2</text><rect x="146" y="126" width="120" height="34" rx="7" fill="#FFFFFF" stroke="#D8C7BC" stroke-width="1.5"/><text x="206.0" y="140.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#3A2A2E" font-weight="500" text-anchor="middle">open</text><text x="206.0" y="156.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#6F5D63" font-weight="400" text-anchor="middle">reads timestamp T1</text><rect x="516" y="126" width="128" height="34" rx="7" fill="#F6E3E5" stroke="#D03C4A" stroke-width="1.5"/><text x="580.0" y="140.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#A83232" font-weight="600" text-anchor="middle">save</text><text x="580.0" y="156.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#6F5D63" font-weight="400" text-anchor="middle">still holds T1</text><line x1="208" y1="83" x2="324" y2="83" stroke="#D8C7BC" stroke-dasharray="4 3"/><line x1="268" y1="143" x2="514" y2="143" stroke="#D8C7BC" stroke-dasharray="4 3"/><text x="266" y="76" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#6F5D63" font-weight="400" text-anchor="middle">edits</text><text x="450" y="136" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#6F5D63" font-weight="400" text-anchor="middle">edits - no lock is held</text><line x1="380" y1="102" x2="380" y2="196" stroke="#9C8A8E" stroke-width="1.6" marker-end="url(#am)"/><line x1="580" y1="162" x2="580" y2="196" stroke="#D03C4A" stroke-width="1.6" marker-end="url(#ar)"/><rect x="96" y="198" width="548" height="30" rx="7" fill="#F0DFD2" stroke="#D8C7BC" stroke-width="1.5"/><text x="110" y="217" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#3A2A2E" font-weight="500" text-anchor="start">the record</text><text x="380" y="217" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#3A2A2E" font-weight="600" text-anchor="middle">T2</text><text x="28" y="254" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#6F5D63" font-weight="400" text-anchor="start">Without a check: B overwrites what A saved, and nobody notices (the lost update).</text><text x="28" y="272" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#A83232" font-weight="400" text-anchor="start">Optimistic check: at save, B compares T1 with the record. It is T2 now, so the save is refused.</text><line x1="28" y1="292" x2="672" y2="292" stroke="#D8C7BC"/><text x="28" y="312" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#6F5D63" font-weight="400" text-anchor="start">Combined strategy: a lock for the milliseconds of the save, plus the timestamp check inside it.</text></svg>
