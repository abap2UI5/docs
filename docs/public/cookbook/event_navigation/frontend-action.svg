x="304.0" y="154.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#6F5D63" font-weight="400" text-anchor="middle">browser</text><line x1="384" y1="141" x2="400" y2="141" stroke="#9C8A8E" stroke-width="1.6" marker-end="url(#am)"/><rect x="402" y="120" width="156" height="42" rx="7" fill="#F6E3E5" stroke="#D03C4A" stroke-width="1.5"/><text x="480.0" y="138.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#A83232" font-weight="600" text-anchor="middle">action runs</text><text x="480.0" y="154.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#6F5D63" font-weight="400" text-anchor="middle">browser only</text><line x1="560" y1="141" x2="576" y2="141" stroke="#9C8A8E" stroke-width="1.6" marker-end="url(#am)"/><rect x="578" y="120" width="156" height="42" rx="7" fill="#FFFFFF" stroke="#D8C7BC" stroke-width="1.5" stroke-dasharray="5 4"/><text x="656.0" y="138.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#3A2A2E" font-weight="500" text-anchor="middle">no roundtrip</text><text x="656.0" y="154.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#6F5D63" font-weight="400" text-anchor="middle">main( ) is not called</text><text x="28" y="200" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#A83232" font-weight="600" text-anchor="start">follow_up_action( )</text><text x="28" y="217" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#6F5D63" font-weight="400" text-anchor="start">as a statement in main( )</text><rect x="226" y="184" width="156" height="42" rx="7" fill="#FFFFFF" stroke="#D8C7BC" stroke-width="1.5"/><text x="304.0" y="202.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#3A2A2E" font-weight="500" text-anchor="middle">main( ) runs</text><text x="304.0" y="218.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#6F5D63" font-weight="400" text-anchor="middle">the roundtrip is running</text><line x1="384" y1="205" x2="400" y2="205" stroke="#9C8A8E" stroke-width="1.6" marker-end="url(#am)"/><rect x="402" y="184" width="156" height="42" rx="7" fill="#FFFFFF" stroke="#D8C7BC" stroke-width="1.5"/><text x="480.0" y="202.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#3A2A2E" font-weight="500" text-anchor="middle">response</text><text x="480.0" y="218.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#6F5D63" font-weight="400" text-anchor="middle">carries the action</text><line x1="560" y1="205" x2="576" y2="205" stroke="#9C8A8E" stroke-width="1.6" marker-end="url(#am)"/><rect x="578" y="184" width="156" height="42" rx="7" fill="#F6E3E5" stroke="#D03C4A" stroke-width="1.5"/><text x="656.0" y="202.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#A83232" font-weight="600" text-anchor="middle">action runs</text><text x="656.0" y="218.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#6F5D63" font-weight="400" text-anchor="middle">browser, afterwards</text><text x="28" y="250" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#6F5D63" font-weight="400" text-anchor="start">A frontend action is something the browser does by itself: close a popup, set the focus, copy a text.</text><line x1="28" y1="274" x2="732" y2="274" stroke="#D8C7BC"/><text x="28" y="294" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#6F5D63" font-weight="400" text-anchor="start">Same call in both places. Where you write it decides when the browser runs it.</text></svg>
