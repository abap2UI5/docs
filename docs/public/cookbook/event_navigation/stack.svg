ation Mono',monospace" font-size="12.5" fill="#A83232" font-weight="600" text-anchor="middle">zcl_app_list</text><text x="103" y="170.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#6F5D63" font-weight="400" text-anchor="middle">running</text><rect x="278" y="76" width="150" height="48" rx="7" fill="#F6E3E5" stroke="#D03C4A" stroke-width="1.5"/><text x="353" y="97.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#A83232" font-weight="600" text-anchor="middle">zcl_app_detail</text><text x="353" y="114.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#6F5D63" font-weight="400" text-anchor="middle">running</text><rect x="278" y="132" width="150" height="48" rx="7" fill="#FFFFFF" stroke="#D8C7BC" stroke-width="1.5" stroke-dasharray="5 4"/><text x="353" y="153.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#3A2A2E" font-weight="500" text-anchor="middle">zcl_app_list</text><text x="353" y="170.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#6F5D63" font-weight="400" text-anchor="middle">waits as an app draft</text><rect x="528" y="76" width="150" height="48" rx="7" fill="#F0DFD2" stroke="#D8C7BC" stroke-width="1.5"/><text x="603" y="97.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#6F5D63" font-weight="500" text-anchor="middle">zcl_app_detail</text><text x="603" y="114.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#6F5D63" font-weight="400" text-anchor="middle">read via get_app_prev( )</text><rect x="528" y="132" width="150" height="48" rx="7" fill="#F6E3E5" stroke="#D03C4A" stroke-width="1.5"/><text x="603" y="153.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#A83232" font-weight="600" text-anchor="middle">zcl_app_list</text><text x="603" y="170.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#6F5D63" font-weight="400" text-anchor="middle">check_on_navigated( )</text><line x1="186" y1="156" x2="270" y2="156" stroke="#D03C4A" stroke-width="1.6" marker-end="url(#ar)"/><text x="228" y="147" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#D03C4A" font-weight="600" text-anchor="middle">nav_app_call</text><line x1="436" y1="128" x2="520" y2="128" stroke="#D03C4A" stroke-width="1.6" marker-end="url(#ar)"/><text x="478" y="119" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#D03C4A" font-weight="600" text-anchor="middle">nav_app_leave</text><line x1="28" y1="202" x2="678" y2="202" stroke="#D8C7BC"/><text x="28" y="222" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#6F5D63" font-weight="400" text-anchor="start">Dashed: the app below does not run while it waits - it is an app draft, like every app between two clicks</text></svg>
