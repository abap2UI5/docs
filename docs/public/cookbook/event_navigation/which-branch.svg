<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 662 284" width="662" height="284" role="img"><style data-dark="">@media (prefers-color-scheme:dark){[fill="#FAF2EC"]{fill:#172033}[fill="#F0DFD2"]{fill:#1e2940}[fill="#FFFFFF"]{fill:#0f1522}[fill="#3A2A2E"]{fill:#f1f4f9}[fill="#6F5D63"]{fill:#9aa4b5}[fill="#F6E3E5"]{fill:#3a1d22}[fill="#D03C4A"]{fill:#f0606d}[fill="#A83232"]{fill:#ff8a95}[stroke="#D8C7BC"]{stroke:#34405a}[stroke="#9C8A8E"]{stroke:#6b778c}[stroke="#D03C4A"]{stroke:#f0606d}}</style><defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6F5D63"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D03C4A"/></marker></defs><rect width="662" height="284" rx="10" fill="#FAF2EC" stroke="#D8C7BC"/><text x="28" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#3A2A2E" font-weight="700" text-anchor="start">Which check is true - and which branch of the chain runs</text><text x="330" y="64" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#3A2A2E" font-weight="600" text-anchor="middle">check_on_init</text><text x="452" y="64" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#3A2A2E" font-weight="600" text-anchor="middle">check_on_navigated</text><text x="574" y="64" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#3A2A2E" font-weight="600" text-anchor="middle">check_on_event</text><line x1="28" y1="74" x2="634" y2="74" stroke="#D8C7BC"/><text x="28" y="102" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#3A2A2E" font-weight="500" text-anchor="start">the first start</text><circle cx="330" cy="98" r="6" fill="#D03C4A"/><circle cx="452" cy="98" r="5.25" fill="#FFFFFF" stroke="#D03C4A" stroke-width="1.5"/><line x1="569" y1="98" x2="579" y2="98" stroke="#D8C7BC" stroke-width="1.5"/><text x="28" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#3A2A2E" font-weight="500" text-anchor="start">a click, a timer, any event</text><line x1="325" y1="128" x2="335" y2="128" stroke="#D8C7BC" stroke-width="1.5"/><line x1="447" y1="128" x2="457" y2="128" stroke="#D8C7BC" stroke-width="1.5"/><circle cx="574" cy="128" r="6" fill="#D03C4A"/><text x="28" y="162" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#3A2A2E" font-weight="500" text-anchor="start">back from a sub-app or a popup</text><line x1="325" y1="158" x2="335" y2="158" stroke="#D8C7BC" stroke-width="1.5"/><circle cx="452" cy="158" r="6" fill="#D03C4A"/><line x1="569" y1="158" x2="579" y2="158" stroke="#D8C7BC" stroke-width="1.5"/><text x="28" y="192" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#3A2A2E" font-weight="500" text-anchor="start">a bookmarked state is restored</text><line x1="325" y1="188" x2="335" y2="188" stroke="#D8C7BC" stroke-width="1.5"/><circle cx="452" cy="188" r="6" fill="#D03C4A"/><line x1="569" y1="188" x2="579" y2="188" stroke="#D8C7BC" stroke-width="1.5"/><circle cx="34" cy="226" r="6" fill="#D03C4A"/><text x="48" y="230" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#6F5D63" font-weight="400" text-anchor="start">true, and the branch that runs</text><circle cx="262" cy="226" r="5.25" fill="#FFFFFF" stroke="#D03C4A" stroke-width="1.5"/><text x="276" y="230" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#6F5D63" font-weight="400" text-anchor="start">true as well, but the chain already took the first</text><line x1="28" y1="246" x2="634" y2="246" stroke="#D8C7BC"/><text x="28" y="266" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#6F5D63" font-weight="400" text-anchor="start">IF takes the first true check - so init comes before navigated, or the one-time setup never runs</text></svg>
