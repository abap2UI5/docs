<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 588 264" width="588" height="264" role="img"><defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9C8A8E"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D03C4A"/></marker></defs><rect width="588" height="264" rx="10" fill="#FAF2EC" stroke="#D8C7BC"/><text x="28" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#3A2A2E" font-weight="700" text-anchor="start">Where an app reaches past the XML view</text><rect x="28" y="56" width="178" height="40" rx="7" fill="#F6E3E5" stroke="#D03C4A" stroke-width="1.5"/><text x="117.0" y="80.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="600" fill="#A83232" text-anchor="middle">a method by control id</text><line x1="214" y1="76" x2="246" y2="76" stroke="#D03C4A" stroke-width="1.6" marker-end="url(#ar)"/><text x="254" y="73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#3A2A2E" font-weight="400" text-anchor="start">follow_up_action( cs_event-control_by_id )</text><text x="254" y="89" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#9C8A8E" font-weight="400" text-anchor="start">no JavaScript at all</text><rect x="28" y="110" width="178" height="40" rx="7" fill="#FFFFFF" stroke="#D8C7BC" stroke-width="1.5"/><text x="117.0" y="134.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="500" fill="#3A2A2E" text-anchor="middle">an expression in the view</text><line x1="214" y1="130" x2="246" y2="130" stroke="#9C8A8E" stroke-width="1.6" marker-end="url(#am)"/><text x="254" y="127" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#3A2A2E" font-weight="400" text-anchor="start">{= ${STATUS} === 'E' ? 'Error' : 'None' }</text><text x="254" y="143" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#9C8A8E" font-weight="400" text-anchor="start">evaluated in the browser</text><rect x="28" y="164" width="178" height="40" rx="7" fill="#FFFFFF" stroke="#D8C7BC" stroke-width="1.5"/><text x="117.0" y="188.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="500" fill="#3A2A2E" text-anchor="middle">a custom control</text><line x1="214" y1="184" x2="246" y2="184" stroke="#9C8A8E" stroke-width="1.6" marker-end="url(#am)"/><text x="254" y="181" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#3A2A2E" font-weight="400" text-anchor="start">z2ui5_ccc - a BSP the UI5 loader resolves</text><text x="254" y="197" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#9C8A8E" font-weight="400" text-anchor="start">a module, not a string</text><line x1="28" y1="226" x2="560" y2="226" stroke="#D8C7BC"/><text x="28" y="246" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9C8A8E" font-weight="400" text-anchor="start">Everything else - JavaScript for the first page - is one setting in the user exit, for the whole system</text></svg>