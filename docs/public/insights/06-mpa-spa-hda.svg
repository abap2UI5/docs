amily="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9C8A8E" font-weight="400" text-anchor="middle">routes and state</text><text x="255" y="145" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9C8A8E" font-weight="400" text-anchor="middle">in the browser</text><text x="255" y="176" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9C8A8E" font-weight="400" text-anchor="middle">rebuild to change</text><rect x="344" y="54" width="138" height="56" rx="7" fill="#F6E3E5" stroke="#D03C4A" stroke-width="1.5"/><text x="413.0" y="86.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="600" fill="#A83232" text-anchor="middle">HDA</text><text x="413" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9C8A8E" font-weight="400" text-anchor="middle">the server sends</text><text x="413" y="145" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9C8A8E" font-weight="400" text-anchor="middle">what to show</text><text x="413" y="176" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#A83232" font-weight="600" text-anchor="middle">nothing to rebuild</text><line x1="28" y1="192" x2="472" y2="192" stroke="#D8C7BC"/><text x="28" y="212" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9C8A8E" font-weight="400" text-anchor="start">abap2UI5 puts the browser in the third column - the sweet spot the other two leave open</text></svg>