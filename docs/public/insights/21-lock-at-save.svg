<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 548 216" width="548" height="216" role="img"><defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9C8A8E"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D03C4A"/></marker></defs><rect width="548" height="216" rx="10" fill="#FAF2EC" stroke="#D8C7BC"/><text x="28" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#3A2A2E" font-weight="700" text-anchor="start">Where the lock lives</text><text x="28" y="60" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#3A2A2E" font-weight="600" text-anchor="start">GUI dialog</text><rect x="120" y="48" width="400" height="18" rx="4" fill="#F0DFD2" stroke="#D8C7BC"/><text x="320" y="61" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#9C8A8E" font-weight="400" text-anchor="middle">ENQUEUE held for the whole session</text><text x="28" y="106" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#A83232" font-weight="600" text-anchor="start">abap2UI5</text><rect x="120" y="92" width="116" height="20" rx="4" fill="#FFFFFF" stroke="#D8C7BC"/><text x="178" y="106" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#9C8A8E" font-weight="400" text-anchor="middle">open</text><rect x="262" y="92" width="116" height="20" rx="4" fill="#FFFFFF" stroke="#D8C7BC"/><text x="320" y="106" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#9C8A8E" font-weight="400" text-anchor="middle">edit</text><rect x="404" y="92" width="116" height="20" rx="4" fill="#FFFFFF" stroke="#D8C7BC"/><text x="462" y="106" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#9C8A8E" font-weight="400" text-anchor="middle">save</text><rect x="452" y="92" width="52" height="20" rx="4" fill="#F6E3E5" stroke="#D03C4A" stroke-width="1.4"/><text x="478" y="106" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#A83232" font-weight="700" text-anchor="middle">lock</text><line x1="238" y1="126" x2="402" y2="126" stroke="#9C8A8E" stroke-dasharray="4 3"/><text x="320" y="142" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#9C8A8E" font-weight="400" text-anchor="middle">minutes - nobody holds anything</text><text x="320" y="158" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#A83232" font-weight="400" text-anchor="middle">the timestamp read at open is compared at save</text><line x1="28" y1="178" x2="520" y2="178" stroke="#D8C7BC"/><text x="28" y="198" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9C8A8E" font-weight="400" text-anchor="start">The lock exists for milliseconds, inside one roundtrip; the optimistic check guards the rest</text></svg>