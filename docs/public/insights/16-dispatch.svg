<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 548 264" width="548" height="264" role="img"><defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9C8A8E"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D03C4A"/></marker></defs><rect width="548" height="264" rx="10" fill="#FAF2EC" stroke="#D8C7BC"/><text x="28" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#3A2A2E" font-weight="700" text-anchor="start">main( ) asks three questions, in this order</text><rect x="28" y="56" width="190" height="40" rx="7" fill="#F6E3E5" stroke="#D03C4A" stroke-width="1.5"/><text x="123.0" y="80.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="600" fill="#A83232" text-anchor="middle">check_on_init( )</text><text x="232" y="73" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#3A2A2E" font-weight="400" text-anchor="start">once - the instance has never run</text><text x="232" y="89" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#A83232" font-weight="600" text-anchor="start">read data, show the view</text><rect x="28" y="110" width="190" height="40" rx="7" fill="#FFFFFF" stroke="#D8C7BC" stroke-width="1.5"/><text x="123.0" y="134.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="500" fill="#3A2A2E" text-anchor="middle">check_on_navigated( )</text><text x="232" y="127" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#3A2A2E" font-weight="400" text-anchor="start">back from a sub-app or popup</text><text x="232" y="143" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9C8A8E" font-weight="400" text-anchor="start">show the view again</text><rect x="28" y="164" width="190" height="40" rx="7" fill="#FFFFFF" stroke="#D8C7BC" stroke-width="1.5"/><text x="123.0" y="188.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="500" fill="#3A2A2E" text-anchor="middle">check_on_event( )</text><text x="232" y="181" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#3A2A2E" font-weight="400" text-anchor="start">the user did something</text><text x="232" y="197" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9C8A8E" font-weight="400" text-anchor="start">change attributes - the view stands</text><line x1="28" y1="226" x2="520" y2="226" stroke="#D8C7BC"/><text x="28" y="246" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9C8A8E" font-weight="400" text-anchor="start">A first call raises init AND navigated - so init stands first, or it never runs</text></svg>