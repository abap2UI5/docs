<!doctype html>
<!--

-->

    <title>Page moved - abap2UI5</title>

    <meta name="robots" content="noindex">
    <script>location.replace("/docs/tutorials/step-12.html" + location.hash);</script>
  </head>
  <body>
    <p>
      This page moved to
      <a href="/docs/tutorials/step-12.html">Step 12: Unit Tests</a>.
    </p>
