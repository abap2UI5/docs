ll="#3A2A2E" font-weight="500" text-anchor="middle">ICF node</text><text x="241.0" y="115.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#6F5D63" font-weight="400" text-anchor="middle">SICF</text><line x1="312" y1="102" x2="324" y2="102" stroke="#9C8A8E" stroke-width="1.6" marker-end="url(#am)"/><rect x="326" y="78" width="138" height="48" rx="7" fill="#FFFFFF" stroke="#D8C7BC" stroke-width="1.5"/><text x="395.0" y="99.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#3A2A2E" font-weight="500" text-anchor="middle">your handler class</text><text x="395.0" y="115.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#6F5D63" font-weight="400" text-anchor="middle">calls the framework</text><line x1="466" y1="102" x2="478" y2="102" stroke="#9C8A8E" stroke-width="1.6" marker-end="url(#am)"/><rect x="480" y="78" width="138" height="48" rx="7" fill="#FFFFFF" stroke="#D8C7BC" stroke-width="1.5"/><text x="549.0" y="99.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#3A2A2E" font-weight="500" text-anchor="middle">abap2UI5 handler</text><text x="549.0" y="115.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#6F5D63" font-weight="400" text-anchor="middle">every request</text><line x1="620" y1="102" x2="632" y2="102" stroke="#9C8A8E" stroke-width="1.6" marker-end="url(#am)"/><rect x="634" y="78" width="138" height="48" rx="7" fill="#F6E3E5" stroke="#D03C4A" stroke-width="1.5"/><text x="703.0" y="99.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#A83232" font-weight="600" text-anchor="middle">app main( )</text><text x="703.0" y="115.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#6F5D63" font-weight="400" text-anchor="middle">your app class</text><rect x="166" y="150" width="150" height="74" rx="7" fill="#F0DFD2" stroke="#D8C7BC" stroke-width="1.5"/><line x1="241" y1="128" x2="241" y2="150" stroke="#D8C7BC"/><text x="241" y="172" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#3A2A2E" font-weight="400" text-anchor="middle">logon, SSO</text><text x="241" y="189" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#3A2A2E" font-weight="400" text-anchor="middle">SAP Authorization field,</text><text x="241" y="206" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#3A2A2E" font-weight="400" text-anchor="middle">checked against S_ICF</text><rect x="320" y="150" width="150" height="74" rx="7" fill="#F0DFD2" stroke="#D8C7BC" stroke-width="1.5"/><line x1="395" y1="128" x2="395" y2="150" stroke="#D8C7BC"/><text x="395" y="172" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#3A2A2E" font-weight="400" text-anchor="middle">optional:</text><text x="395" y="189" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#3A2A2E" font-weight="400" text-anchor="middle">an AUTHORITY-CHECK</text><text x="395" y="206" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#3A2A2E" font-weight="400" text-anchor="middle">of your own</text><rect x="474" y="150" width="150" height="74" rx="7" fill="#F0DFD2" stroke="#D8C7BC" stroke-width="1.5"/><line x1="549" y1="128" x2="549" y2="150" stroke="#D8C7BC"/><text x="549" y="172" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#3A2A2E" font-weight="400" text-anchor="middle">CSRF check on every POST</text><text x="549" y="189" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#3A2A2E" font-weight="400" text-anchor="middle">response headers</text><text x="549" y="206" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#3A2A2E" font-weight="400" text-anchor="middle">and the CSP</text><rect x="628" y="150" width="150" height="74" rx="7" fill="#F0DFD2" stroke="#D8C7BC" stroke-width="1.5"/><line x1="703" y1="128" x2="703" y2="150" stroke="#D8C7BC"/><text x="703" y="172" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#3A2A2E" font-weight="400" text-anchor="middle">AUTHORITY-CHECK</text><text x="703" y="189" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#3A2A2E" font-weight="400" text-anchor="middle">at the top of main( ):</text><text x="703" y="206" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#3A2A2E" font-weight="400" text-anchor="middle">this app, this data</text><text x="84" y="172" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#6F5D63" font-weight="400" text-anchor="middle">a proxy or Web</text><text x="84" y="189" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#6F5D63" font-weight="400" text-anchor="middle">Dispatcher may sit</text><text x="84" y="206" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#6F5D63" font-weight="400" text-anchor="middle">in front of the node</text><rect x="330" y="254" width="150" height="44" rx="7" fill="#FFFFFF" stroke="#D8C7BC" stroke-width="1.5"/><text x="405.0" y="273.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#3A2A2E" font-weight="500" text-anchor="middle">exit class</text><text x="405.0" y="289.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#6F5D63" font-weight="400" text-anchor="middle">z2ui5_if_ui5_exit</text><line x1="482" y1="266" x2="520" y2="228" stroke="#9C8A8E" stroke-width="1.6" marker-end="url(#am)"/><text x="405" y="316" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#6F5D63" font-weight="400" text-anchor="middle">sets the CSP and the headers</text><rect x="560" y="254" width="212" height="44" rx="7" fill="#FFFFFF" stroke="#D8C7BC" stroke-width="1.5"/><text x="666.0" y="273.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#3A2A2E" font-weight="500" text-anchor="middle">table z2ui5_t_01</text><text x="666.0" y="289.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#6F5D63" font-weight="400" text-anchor="middle">the app draft, read and written</text><line x1="590" y1="226" x2="620" y2="252" stroke="#9C8A8E" stroke-width="1.6" marker-end="url(#am)" marker-start="url(#am)"/><text x="28" y="246" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#6F5D63" font-weight="400" text-anchor="start">Checks run left to right.</text><text x="28" y="263" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#6F5D63" font-weight="400" text-anchor="start">A request stopped at one box</text><text x="28" y="280" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#6F5D63" font-weight="400" text-anchor="start">never reaches the next.</text><line x1="28" y1="334" x2="772" y2="334" stroke="#D8C7BC"/><text x="28" y="354" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#6F5D63" font-weight="400" text-anchor="start">abap2UI5 adds no authorization of its own: the node decides who gets in, the app decides what a user may do.</text></svg>
