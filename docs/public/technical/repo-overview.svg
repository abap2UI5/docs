<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="950" viewBox="0 0 1560 950" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1560" height="950" fill="#f8fafc"/>

  <!-- Title -->
  <text x="780" y="52" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">abap2UI5 — Repository Overview</text>
  <text x="780" y="80" text-anchor="middle" font-size="14" fill="#64748b">How the repositories and branches of github.com/abap2UI5 work together</text>

  <!-- ================= Zone A: upstream mirrors ================= -->
  <rect x="40" y="120" width="270" height="310" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="6 4"/>
  <text x="58" y="148" font-size="11" font-weight="700" letter-spacing="1.5" fill="#64748b">UPSTREAM MIRRORS</text>

  <rect x="60" y="170" width="230" height="100" rx="10" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <text x="74" y="196" font-size="16" font-weight="700" fill="#334155">mirror-ajson</text>
  <rect x="236" y="178" width="40" height="18" rx="9" fill="#334155"/>
  <text x="256" y="191" text-anchor="middle" font-size="10.5" font-weight="600" fill="#ffffff">main</text>
  <text x="74" y="216" font-size="12" fill="#334155">
    <tspan x="74" dy="0">sbcgua/ajson (JSON library)</tspan>
    <tspan x="74" dy="16">mirrored into the z2ui5</tspan>
    <tspan x="74" dy="16">namespace</tspan>
  </text>

  <rect x="60" y="300" width="230" height="100" rx="10" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <text x="74" y="326" font-size="16" font-weight="700" fill="#334155">mirror-srtti</text>
  <rect x="236" y="308" width="40" height="18" rx="9" fill="#334155"/>
  <text x="256" y="321" text-anchor="middle" font-size="10.5" font-weight="600" fill="#ffffff">main</text>
  <text x="74" y="346" font-size="12" fill="#334155">
    <tspan x="74" dy="0">S-RTTI (runtime type</tspan>
    <tspan x="74" dy="16">serialization) mirrored into</tspan>
    <tspan x="74" dy="16">the z2ui5 namespace</tspan>
  </text>

  <!-- End-user browser -->
  <rect x="40" y="480" width="270" height="150" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="58" y="510" font-size="16" font-weight="700" fill="#0f172a">🌐 End-user browser</text>
  <text x="58" y="532" font-size="12" fill="#334155">
    <tspan x="58" dy="0">The UI5 frontend runs here —</tspan>
    <tspan x="58" dy="16">only view definitions and data</tspan>
    <tspan x="58" dy="16">travel over the wire</tspan>
    <tspan x="58" dy="16">(“UI5 over-the-wire”)</tspan>
  </text>
  <path d="M312,585 H388" fill="none" stroke="#64748b" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="350" y="575" text-anchor="middle" font-size="10.5" fill="#64748b">HTTP · JSON</text>

  <!-- ================= Zone B: ABAP system ================= -->
  <rect x="350" y="120" width="560" height="560" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-dasharray="6 4"/>
  <text x="368" y="148" font-size="11" font-weight="700" letter-spacing="1.5" fill="#2563eb">ABAP SYSTEM — INSTALLED VIA ABAPGIT (CLOUD &amp; ON-PREMISE)</text>

  <!-- core -->
  <rect x="390" y="170" width="480" height="140" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="404" y="198" font-size="18" font-weight="700" fill="#1d4ed8">abap2UI5 <tspan font-size="12" font-weight="400" fill="#475569">· core framework</tspan></text>
  <text x="404" y="220" font-size="12" fill="#1e293b">
    <tspan x="404" dy="0">One ABAP HTTP handler renders complete UI5 apps written purely in ABAP —</tspan>
    <tspan x="404" dy="16">implement a single interface (z2ui5_if_app), install via abapGit. No BSP, OData,</tspan>
    <tspan x="404" dy="16">CDS or RAP. Ships the z2ui5-namespace mirrors of ajson &amp; S-RTTI.</tspan>
  </text>
  <rect x="404" y="268" width="40" height="18" rx="9" fill="#334155"/>
  <text x="424" y="281" text-anchor="middle" font-size="10.5" font-weight="600" fill="#ffffff">main</text>
  <rect x="452" y="268" width="34" height="18" rx="9" fill="#ffffff" stroke="#64748b" stroke-dasharray="3 2"/>
  <text x="469" y="281" text-anchor="middle" font-size="10.5" font-weight="600" fill="#475569">702</text>
  <text x="496" y="281" font-size="10.5" fill="#64748b">← auto-downported for NW 7.02+</text>

  <!-- frontend -->
  <rect x="390" y="370" width="225" height="130" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="404" y="396" font-size="16" font-weight="700" fill="#0f766e">frontend</text>
  <text x="404" y="416" font-size="12" fill="#134e4a">
    <tspan x="404" dy="0">UI5 webapp / BSP artefacts</tspan>
    <tspan x="404" dy="16">pairing with the backend</tspan>
  </text>
  <rect x="404" y="446" width="40" height="18" rx="9" fill="#334155"/>
  <text x="424" y="459" text-anchor="middle" font-size="10.5" font-weight="600" fill="#ffffff">main</text>
  <rect x="452" y="446" width="46" height="18" rx="9" fill="#ffffff" stroke="#64748b" stroke-dasharray="3 2"/>
  <text x="475" y="459" text-anchor="middle" font-size="10.5" font-weight="600" fill="#475569">cloud</text>
  <rect x="506" y="446" width="64" height="18" rx="9" fill="#ffffff" stroke="#64748b" stroke-dasharray="3 2"/>
  <text x="538" y="459" text-anchor="middle" font-size="10.5" font-weight="600" fill="#475569">cloud_v2</text>
  <rect x="404" y="470" width="64" height="18" rx="9" fill="#ffffff" stroke="#64748b" stroke-dasharray="3 2"/>
  <text x="436" y="483" text-anchor="middle" font-size="10.5" font-weight="600" fill="#475569">standard</text>
  <rect x="476" y="470" width="82" height="18" rx="9" fill="#ffffff" stroke="#64748b" stroke-dasharray="3 2"/>
  <text x="517" y="483" text-anchor="middle" font-size="10.5" font-weight="600" fill="#475569">standard_v2</text>

  <!-- samples -->
  <rect x="645" y="370" width="225" height="130" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="659" y="396" font-size="16" font-weight="700" fill="#b45309">samples</text>
  <text x="659" y="416" font-size="12" fill="#78350f">
    <tspan x="659" dy="0">350+ demo apps, each</tspan>
    <tspan x="659" dy="16">implementing z2ui5_if_app</tspan>
  </text>
  <rect x="659" y="446" width="64" height="18" rx="9" fill="#334155"/>
  <text x="691" y="459" text-anchor="middle" font-size="10.5" font-weight="600" fill="#ffffff">standard</text>
  <rect x="731" y="446" width="46" height="18" rx="9" fill="#ffffff" stroke="#64748b" stroke-dasharray="3 2"/>
  <text x="754" y="459" text-anchor="middle" font-size="10.5" font-weight="600" fill="#475569">cloud</text>
  <rect x="785" y="446" width="34" height="18" rx="9" fill="#ffffff" stroke="#64748b" stroke-dasharray="3 2"/>
  <text x="802" y="459" text-anchor="middle" font-size="10.5" font-weight="600" fill="#475569">702</text>
  <text x="659" y="483" font-size="10.5" fill="#92710c">cloud = restricted samples stripped</text>

  <!-- local -->
  <rect x="390" y="550" width="480" height="110" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="404" y="576" font-size="16" font-weight="700" fill="#0f766e">abap2UI5-local</text>
  <text x="404" y="596" font-size="12" fill="#134e4a">
    <tspan x="404" dy="0">The whole framework generated into one self-contained HTTP handler class</tspan>
    <tspan x="404" dy="16">(local classes) — zero dependency on an abap2UI5 installation</tspan>
  </text>
  <rect x="404" y="626" width="40" height="18" rx="9" fill="#334155"/>
  <text x="424" y="639" text-anchor="middle" font-size="10.5" font-weight="600" fill="#ffffff">main</text>
  <rect x="452" y="626" width="64" height="18" rx="9" fill="#ffffff" stroke="#64748b" stroke-dasharray="3 2"/>
  <text x="484" y="639" text-anchor="middle" font-size="10.5" font-weight="600" fill="#475569">standard</text>
  <rect x="524" y="626" width="34" height="18" rx="9" fill="#ffffff" stroke="#64748b" stroke-dasharray="3 2"/>
  <text x="541" y="639" text-anchor="middle" font-size="10.5" font-weight="600" fill="#475569">702</text>
  <rect x="566" y="626" width="46" height="18" rx="9" fill="#ffffff" stroke="#64748b" stroke-dasharray="3 2"/>
  <text x="589" y="639" text-anchor="middle" font-size="10.5" font-weight="600" fill="#475569">cloud</text>
  <text x="624" y="639" font-size="10.5" fill="#64748b">main = input synced from the core</text>

  <!-- arrows inside zone B -->
  <path d="M502,368 V312" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="494" y="345" text-anchor="end" font-size="10.5" fill="#64748b">pairs with</text>

  <path d="M757,368 V312" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="765" y="345" font-size="10.5" fill="#64748b">built on</text>

  <path d="M630,312 V548" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="630" y="334" text-anchor="middle" font-size="10.5" fill="#64748b">generated by GitHub Actions</text>
  <text x="630" y="348" text-anchor="middle" font-size="10.5" fill="#64748b">(bundled into a single handler)</text>

  <!-- ================= Zone C: browser runtime ================= -->
  <rect x="950" y="120" width="570" height="560" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-dasharray="6 4"/>
  <text x="968" y="148" font-size="11" font-weight="700" letter-spacing="1.5" fill="#7c3aed">BROWSER RUNTIME — NO ABAP SYSTEM NEEDED</text>

  <!-- web-abap2UI5 -->
  <rect x="990" y="170" width="490" height="160" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="1004" y="196" font-size="16" font-weight="700" fill="#6d28d9">web-abap2UI5</text>
  <rect x="1426" y="178" width="40" height="18" rx="9" fill="#334155"/>
  <text x="1446" y="191" text-anchor="middle" font-size="10.5" font-weight="600" fill="#ffffff">main</text>
  <text x="1004" y="216" font-size="12" fill="#3b0764">
    <tspan x="1004" dy="0">Build pipeline that puts abap2UI5 into the browser:</tspan>
    <tspan x="1004" dy="18">1. downport the ABAP sources with abaplint</tspan>
    <tspan x="1004" dy="16">2. transpile ABAP → JavaScript (@abaplint/transpiler)</tspan>
    <tspan x="1004" dy="16">3. serve via express-icf-shim on Node.js</tspan>
    <tspan x="1004" dy="16">4. webpack everything with sql.js (WASM in-memory database)</tspan>
  </text>

  <!-- web build -->
  <rect x="990" y="390" width="490" height="110" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="1004" y="416" font-size="16" font-weight="700" fill="#6d28d9">web-abap2UI5-build</text>
  <rect x="1426" y="398" width="40" height="18" rx="9" fill="#ffffff" stroke="#64748b" stroke-dasharray="3 2"/>
  <text x="1446" y="411" text-anchor="middle" font-size="10.5" font-weight="600" fill="#475569">main</text>
  <text x="1004" y="436" font-size="12" fill="#3b0764">
    <tspan x="1004" dy="0">Generated static bundle (app.bundle.js + WASM) — the live playground:</tspan>
    <tspan x="1004" dy="16">🌍 abap2ui5.github.io/web-abap2UI5-build — try abap2UI5 with zero installation</tspan>
  </text>

  <!-- ai-demokit -->
  <rect x="990" y="550" width="490" height="110" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="1004" y="576" font-size="16" font-weight="700" fill="#b45309">ai-demokit</text>
  <rect x="1384" y="558" width="40" height="18" rx="9" fill="#334155"/>
  <text x="1404" y="571" text-anchor="middle" font-size="10.5" font-weight="600" fill="#ffffff">main</text>
  <rect x="1432" y="558" width="34" height="18" rx="9" fill="#ffffff" stroke="#64748b" stroke-dasharray="3 2"/>
  <text x="1449" y="571" text-anchor="middle" font-size="10.5" font-weight="600" fill="#475569">702</text>
  <text x="1004" y="596" font-size="12" fill="#78350f">
    <tspan x="1004" dy="0">AI-generated: every OpenUI5 demo kit sample rebuilt as an abap2UI5 app,</tspan>
    <tspan x="1004" dy="16">exposing functional gaps so they can be closed. Runs in your ABAP system</tspan>
    <tspan x="1004" dy="16">or fully in-browser: 🌍 abap2ui5.github.io/ai-demokit</tspan>
  </text>

  <!-- arrows into / inside zone C -->
  <path d="M872,240 H988" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="930" y="228" text-anchor="middle" font-size="10.5" fill="#64748b">cloned (main)</text>

  <path d="M872,410 H930 V270 H988" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="900" y="428" text-anchor="middle" font-size="10.5" fill="#64748b">cloud branch</text>

  <path d="M1235,332 V388" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="1245" y="365" font-size="10.5" fill="#64748b">CI deploys the bundle</text>

  <path d="M990,310 H968 V605 H988" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="962" y="470" font-size="10.5" fill="#64748b" transform="rotate(-90 962 470)" text-anchor="middle">reuses build pipeline</text>

  <!-- ================= docs ================= -->
  <rect x="350" y="730" width="1170" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="368" y="758" font-size="16" font-weight="700" fill="#15803d">docs</text>
  <rect x="1466" y="740" width="40" height="18" rx="9" fill="#334155"/>
  <text x="1486" y="753" text-anchor="middle" font-size="10.5" font-weight="600" fill="#ffffff">main</text>
  <text x="368" y="778" font-size="12" fill="#14532d">
    <tspan x="368" dy="0">VitePress sources of the documentation site — 🌍 abap2ui5.github.io/docs —</tspan>
    <tspan x="368" dy="16">installation guides, cookbook and technical concepts for everything above.</tspan>
  </text>
  <path d="M630,682 V728" fill="none" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="4 4"/>
  <path d="M1235,682 V728" fill="none" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="935" y="712" text-anchor="middle" font-size="10.5" fill="#16a34a">documents</text>

  <!-- mirrors -> core (drawn last so labels stay on top of the zone fills) -->
  <path d="M290,220 H388" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M290,350 H340 V240 H388" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="338" y="196" text-anchor="middle" font-size="10.5" fill="#64748b">
    <tspan x="338" dy="0">bundled into</tspan>
    <tspan x="338" dy="13">the core</tspan>
  </text>

  <!-- ================= Legend ================= -->
  <rect x="60" y="850" width="14" height="14" rx="3" fill="#dbeafe" stroke="#2563eb"/>
  <text x="82" y="862" font-size="12" fill="#334155">Core framework</text>

  <rect x="205" y="850" width="14" height="14" rx="3" fill="#ccfbf1" stroke="#0d9488"/>
