<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 392" width="700" height="392" role="img"><style data-dark="">@media (prefers-color-scheme:dark){[fill="#FAF2EC"]{fill:#172033}[fill="#F0DFD2"]{fill:#1e2940}[fill="#FFFFFF"]{fill:#0f1522}[fill="#3A2A2E"]{fill:#f1f4f9}[fill="#9C8A8E"]{fill:#9aa4b5}[fill="#F6E3E5"]{fill:#3a1d22}[fill="#D03C4A"]{fill:#f0606d}[fill="#A83232"]{fill:#ff8a95}[stroke="#D8C7BC"]{stroke:#34405a}[stroke="#9C8A8E"]{stroke:#6b778c}[stroke="#D03C4A"]{stroke:#f0606d}}</style><defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9C8A8E"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D03C4A"/></marker></defs><rect width="700" height="392" rx="10" fill="#FAF2EC" stroke="#D8C7BC"/><text x="28" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#3A2A2E" font-weight="700" text-anchor="start">One roundtrip, from click to screen</text><rect x="28" y="54" width="150" height="48" rx="7" fill="#FFFFFF" stroke="#D8C7BC" stroke-width="1.5"/><text x="103" y="75.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#3A2A2E" font-weight="500" text-anchor="middle">browser</text><text x="103" y="92.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9C8A8E" font-weight="400" text-anchor="middle">the user clicks</text><rect x="522" y="54" width="150" height="48" rx="7" fill="#FFFFFF" stroke="#D8C7BC" stroke-width="1.5"/><text x="597" y="75.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#3A2A2E" font-weight="500" text-anchor="middle">browser</text><text x="597" y="92.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9C8A8E" font-weight="400" text-anchor="middle">renders</text><line x1="96" y1="108" x2="96" y2="146" stroke="#9C8A8E" stroke-width="1.6" marker-end="url(#am)"/><text x="108" y="131" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9C8A8E" font-weight="400" text-anchor="start">POST: draft id, event, changes</text><line x1="604" y1="150" x2="604" y2="110" stroke="#9C8A8E" stroke-width="1.6" marker-end="url(#am)"/><text x="592" y="131" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9C8A8E" font-weight="400" text-anchor="end">view, model, new draft id</text><rect x="28" y="150" width="644" height="118" rx="7" fill="none" stroke="#D8C7BC" stroke-width="1.5" stroke-dasharray="5 4"/><text x="42" y="170" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9C8A8E" font-weight="400" text-anchor="start">ABAP server - one dialog step, then the work process is free again</text><rect x="40" y="182" width="112" height="70" rx="7" fill="#FFFFFF" stroke="#D8C7BC" stroke-width="1.5"/><text x="96" y="203.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3A2A2E" font-weight="500" text-anchor="middle">1  load draft</text><text x="96" y="221.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#9C8A8E" font-weight="400" text-anchor="middle">the instance, as the</text><text x="96" y="235.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#9C8A8E" font-weight="400" text-anchor="middle">last click left it</text><line x1="153" y1="217" x2="166" y2="217" stroke="#9C8A8E" stroke-width="1.6" marker-end="url(#am)"/><rect x="167" y="182" width="112" height="70" rx="7" fill="#FFFFFF" stroke="#D8C7BC" stroke-width="1.5"/><text x="223" y="203.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3A2A2E" font-weight="500" text-anchor="middle">2  apply changes</text><text x="223" y="221.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#9C8A8E" font-weight="400" text-anchor="middle">what the user typed,</text><text x="223" y="235.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#9C8A8E" font-weight="400" text-anchor="middle">into the attributes</text><line x1="280" y1="217" x2="293" y2="217" stroke="#9C8A8E" stroke-width="1.6" marker-end="url(#am)"/><rect x="294" y="182" width="112" height="70" rx="7" fill="#F6E3E5" stroke="#D03C4A" stroke-width="1.5"/><text x="350" y="203.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#A83232" font-weight="600" text-anchor="middle">3  main( )</text><text x="350" y="221.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#9C8A8E" font-weight="400" text-anchor="middle">your code: read the</text><text x="350" y="235.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#9C8A8E" font-weight="400" text-anchor="middle">event, change state</text><line x1="407" y1="217" x2="420" y2="217" stroke="#9C8A8E" stroke-width="1.6" marker-end="url(#am)"/><rect x="421" y="182" width="112" height="70" rx="7" fill="#FFFFFF" stroke="#D8C7BC" stroke-width="1.5"/><text x="477" y="203.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3A2A2E" font-weight="500" text-anchor="middle">4  respond</text><text x="477" y="221.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#9C8A8E" font-weight="400" text-anchor="middle">view if displayed,</text><text x="477" y="235.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#9C8A8E" font-weight="400" text-anchor="middle">model if changed</text><line x1="534" y1="217" x2="547" y2="217" stroke="#9C8A8E" stroke-width="1.6" marker-end="url(#am)"/><rect x="548" y="182" width="112" height="70" rx="7" fill="#FFFFFF" stroke="#D8C7BC" stroke-width="1.5"/><text x="604" y="203.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3A2A2E" font-weight="500" text-anchor="middle">5  save draft</text><text x="604" y="221.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#9C8A8E" font-weight="400" text-anchor="middle">the whole instance,</text><text x="604" y="235.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#9C8A8E" font-weight="400" text-anchor="middle">under a new id</text><rect x="264" y="300" width="172" height="40" rx="7" fill="#F6E3E5" stroke="#D03C4A" stroke-width="1.5"/><text x="350" y="324.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#A83232" font-weight="600" text-anchor="middle">z2ui5_t_01</text><path d="M264 320 L96 320 L96 258" fill="none" stroke="#D03C4A" stroke-width="1.6" marker-end="url(#ar)"/><text x="180" y="311" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#D03C4A" font-weight="600" text-anchor="middle">read</text><path d="M604 256 L604 320 L442 320" fill="none" stroke="#D03C4A" stroke-width="1.6" marker-end="url(#ar)"/><text x="521" y="311" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#D03C4A" font-weight="600" text-anchor="middle">written</text><text x="28" y="372" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9C8A8E" font-weight="400" text-anchor="start">Nothing waits on the server between two clicks: the next one starts at step 1, with the id this one returned</text></svg>
