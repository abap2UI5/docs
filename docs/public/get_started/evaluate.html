<!doctype html>
<!--
  Redirect for the page that lived at /docs/get_started/evaluate for one day
  (2026-10-23). It moved to /docs/evaluate when it got the landing layout: the
  page is sent to the person who approves abap2UI5, and "get_started" in the
  address said "manual" before they had read a word. The framework's README
  and two of its docs pages linked the old address - so it keeps working.

  VitePress has no redirect mechanism; files under public/ are copied into the
  build verbatim, which is why this is a hand-written page. The one-line
  script keeps a #fragment, because the links into it name sections. Delete
  it only when the old URL has stopped receiving traffic.

  Since then the page moved once more, out of the manual, to the playground's
  deployment (/playground/evaluate/ - docs/public/evaluate.html says why), so
  this goes straight there rather than through a second redirect.
-->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Page moved - abap2UI5</title>
    <link rel="canonical" href="https://abap2ui5.github.io/playground/evaluate/">
    <meta http-equiv="refresh" content="0; url=/playground/evaluate/">
    <meta name="robots" content="noindex">
    <script>location.replace('/playground/evaluate/' + location.hash);</script>
  </head>
  <body>
    <p>
      This page moved to
      <a href="/playground/evaluate/" target="_self">Evaluate abap2UI5</a>.
    </p>
  </body>
</html>
